name: release-appimage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v1.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 desktop-file-utils squashfs-tools binutils curl bzip2 \
            libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3

      - name: Build AppImage
        run: packaging/appimage/build_appimage.sh

      - name: Smoke test
        run: |
          IMG=$(ls build/appimage/MieWorkbench-*-x86_64.AppImage)
          chmod +x "$IMG"
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          "$IMG" --appimage-extract-and-run --version
          "$IMG" --appimage-extract-and-run cli miewb_tool --help
          "$IMG" --appimage-extract-and-run trace --help || true
          MIEWB_ALLOW_UNCONFIGURED=1 QT_QPA_PLATFORM=offscreen "$IMG" --appimage-extract-and-run python -c \
            "import PySide6, vtk, numpy, scipy, h5py; import mieworkbench.mainwindow; print('gui import ok')"
          MIEWB_SMOKE=1 QT_QPA_PLATFORM=offscreen timeout 60 \
            "$IMG" --appimage-extract-and-run

      - name: Publish release
        run: |
          IMG=$(ls build/appimage/MieWorkbench-*-x86_64.AppImage)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IMG" --clobber
          else
            gh release create "$TAG" "$IMG" \
              --target "$GITHUB_SHA" \
              --title "MieWorkbench $TAG" \
              --notes-file packaging/appimage/RELEASE_NOTES.md
          fi
